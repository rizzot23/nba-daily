name: 一球不落 每日战报

on:
  schedule:
    # ⚠️ GitHub 的 cron 一律按 UTC 算，比北京慢 8 小时
    # 分钟数特意避开 :00 / :30 这类整点高峰 —— GitHub 排队时这些点最容易漏投或延迟
    # UTC 06:07 = 北京 14:07（早档：最晚 11:00 开球的比赛约 13:30 终场，留 37 分钟缓冲）
    # 四档都带「比赛日全部终场才出稿」的检查，见下面的「出稿前检查」
    - cron: "7 6 * * *"
    # UTC 07:23 = 北京 15:23（首拉：当天所有比赛约 13:30 前打完，留约 2 小时缓冲）
    - cron: "23 7 * * *"
    # UTC 08:51 = 北京 16:51（补拉：兜住三加时这种打到 15 点还没完的极端情况）
    - cron: "51 8 * * *"
    # UTC 11:37 = 北京 19:37（晚间兜底：GitHub 定时是「尽力而为」，新仓库头几天可能整天不投递）
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      game_date:
        description: "比赛日 YYYY-MM-DD（美国时间），留空则自动取北京时间昨天"
        required: false
        default: ""

# 手动触发和定时触发撞在一起时，后来的排队等前面的跑完，不会同时改 docs/
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 默认只拉最近 1 个提交（浅克隆），后面推送被拒时要 rebase，
          # 浅克隆上 rebase 容易报错，所以这里拉全量。仓库很小，多花不到 1 秒。
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 封面图要画中文，需要 Pillow + 一个开源中文字体。
      # 不能用 Windows 的微软雅黑（微软版权，进不了仓库），也装不到 Ubuntu 上。
      # 这一步失败不影响出稿 —— cover.py 会自己跳过，战报照常生成。
      - name: 装封面依赖
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei
          python -m pip install --quiet --disable-pip-version-check pillow

      # 数据来自 ESPN 公开接口，不需要任何 Key。
      # BALLDONTLIE_API_KEY 只是 ESPN 万一改接口时的比分兜底，没配也能跑。
      # 所有定时档共用的出稿前检查，两条硬规矩：
      # ① 比赛日只要还有一场没终场，绝不出稿、不碰 docs/。
      #    起因：GitHub schedule 会延迟投递，晚间档曾拖到次日 00:16 才跑，那时当天比赛还没开打，
      #    脚本排除未终场场次后推了一份 0 场空战报上线，覆盖掉前一天的完整版。
      # ② 不再死认「北京时间昨天」这一个日期。GitHub 白天常常一档都不投递，只在深夜/凌晨投递，
      #    那时北京日期已翻页，按老口径取到的比赛日还没开打 → 整档跳过，缺的那期就永远补不上。
      #    改成从「北京昨天」往前最多回看 3 天，挑第一个「全部终场且线上还没发」的比赛日补出。
      #    线上已经是这一期时直接跳过，避免每次延迟投递都重推一份只差生成时间的版本。
      # 手动 Run workflow 不走这个检查（gate 被跳过、output 为空），方便补跑指定日期。
      - name: 出稿前检查（挑最近一个全部终场且未发布的比赛日）
        id: gate
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, datetime

          bj = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
          today = bj.date()
          try:
              published = json.loads(pathlib.Path("docs/latest.json").read_text(encoding="utf-8")).get("game_date", "")
          except Exception:
              published = ""
          print("线上已发布比赛日:", published or "(读不到)")

          go, picked = "false", ""
          for back in (1, 2, 3):
              day = today - datetime.timedelta(days=back)
              iso, ymd = day.isoformat(), day.strftime("%Y%m%d")
              url = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + ymd
              try:
                  with urllib.request.urlopen(url, timeout=25) as r:
                      data = json.load(r)
              except Exception as ex:
                  print("ESPN 记分板拉取失败，整档跳过：", ex)
                  break
              evs = data.get("events", [])
              pending = [e.get("shortName", e.get("name", "?")) for e in evs
                         if not e["competitions"][0].get("status", {}).get("type", {}).get("completed")]
              print(f"候选 {iso}: 共 {len(evs)} 场 / 未终场 {len(pending)} 场")
              if pending:
                  continue                      # 这天还没打完，继续往前看一天
              if published and iso <= published:
                  print("线上已是这一期（或更新），不重复出稿")
                  break
              picked, go = iso, "true"
              break

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("go=" + go + "\n")
              f.write("game_date=" + picked + "\n")
          print("补出 " + picked if go == "true" else "整档跳过，页面保留上一期战报")
          PY

      - name: 生成战报
        if: steps.gate.outputs.go != 'false'
        env:
          # 定时档用 gate 挑出来的比赛日（可能往前补一天）；手动档用输入框的值，
          # 留空时 fetch_nba.py 自己取「北京时间昨天」。
          REPORT_GAME_DATE: ${{ steps.gate.outputs.game_date || inputs.game_date }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          echo "运行时间：$(date '+%Y-%m-%d %H:%M %Z')"
          python scripts/fetch_nba.py

      # 下面两步都是「锦上添花」，任何一步挂掉都不该连累后面把战报推上去，
      # 所以都挂 continue-on-error。
      - name: 写运行摘要
        if: ${{ always() && steps.gate.outputs.go != 'false' }}
        continue-on-error: true
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("docs/latest.json")
          if not p.exists():
              print("### ⚠️ 没有产出 latest.json，脚本可能中途失败\n")
              print("去看上面的「生成战报」步骤日志。")
              raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"### 球不落 · {d['game_date']}（美国时间）\n")
          print(f"- 生成时间：{d['generated_at']}")
          print(f"- 完场场次：{d.get('total_games', 0)} 场")
          if d.get("headline"):
              print(f"- 今日最胶着：{d['headline']}")
          # 今日主打：公众号次条和头条号都发这一场
          f = pathlib.Path("docs/feature.json")
          if f.exists():
              fp = json.loads(f.read_text(encoding="utf-8"))
              if fp.get("pick"):
                  print(f"- 今日主打：{fp['pick']}（{fp.get('kind')}）")
                  print(f"- 可用的头条标题：{fp.get('title')}")
              else:
                  print("- 今日主打：今天没有比赛，不发次条")
          t = d.get("tomorrow") or {}
          if t.get("status") == "play" and t.get("pick"):
              pk = t["pick"]
              print(f"- 明日焦点：{pk.get('away')} @ {pk.get('home')}（{pk.get('bj_date')} {pk.get('bj_time')}）")
          elif t.get("status") == "idle":
              print(f"- 明日休战，下一比赛日 {t.get('date_cn')}")
          print("\n→ 成品：`docs/report.html`（公众号主条）、`docs/feature.md`（次条 + 头条）")
          PY

      # 只负责把人叫回来：推一条摘要到微信，点开就是 Pages 上的战报。
      # 不碰公众号任何接口 —— 个人订阅号没有群发权限，最后一步必须人工点。
      # 没配 SC_KEY 就静默跳过。
      - name: 微信提醒
        if: steps.gate.outputs.go != 'false'
        continue-on-error: true
        env:
          SC_KEY: ${{ secrets.SC_KEY }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: python scripts/notify.py

      - name: 归档产物
        if: steps.gate.outputs.go != 'false'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: daily-report-${{ github.run_number }}
          path: docs/
          retention-days: 30

      # 真正要紧的一步放最后：前面任何一步出错都不影响它。
      - name: 回写仓库
        if: steps.gate.outputs.go != 'false'
        run: |
          git config user.name "nba-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "战报：$(date '+%Y-%m-%d') 自动生成"

          # 有人在网页端改过文件时，直接 push 会被拒（non-fast-forward）。
          # 拉取远端变基后再推，最多试三次。
          for i in 1 2 3; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送被拒，拉取远端后重试"
            if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              echo "变基失败，放弃本地这次提交（下次运行会自动重新生成）"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          echo "连续三次推送失败，请检查仓库权限或分支保护设置"
          exit 1
