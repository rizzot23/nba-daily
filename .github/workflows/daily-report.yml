name: 去球吧 每日战报

on:
  schedule:
    # ⚠️ GitHub 的 cron 一律按 UTC 算，比北京慢 8 小时
    # UTC 06:10 = 北京 14:10（早档：最晚 11:00 开球的比赛约 13:30 终场，留 40 分钟缓冲）
    # 这一档只有「当天所有比赛都已终场」才出稿，见下面的「早档检查」
    - cron: "10 6 * * *"
    # UTC 07:30 = 北京 15:30（首拉：当天所有比赛约 13:30 前打完，留 2 小时缓冲）
    - cron: "30 7 * * *"
    # UTC 08:40 = 北京 16:40（补拉：兜住三加时这种打到 15 点还没完的极端情况）
    - cron: "40 8 * * *"
    # UTC 11:20 = 北京 19:20（晚间兜底：GitHub 定时是「尽力而为」，新仓库头几天可能整天不投递）
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      game_date:
        description: "比赛日 YYYY-MM-DD（美国时间），留空则自动取北京时间昨天"
        required: false
        default: ""

# 手动触发和定时触发撞在一起时，后来的排队等前面的跑完，不会同时改 docs/
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 默认只拉最近 1 个提交（浅克隆），后面推送被拒时要 rebase，
          # 浅克隆上 rebase 容易报错，所以这里拉全量。仓库很小，多花不到 1 秒。
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 封面图要画中文，需要 Pillow + 一个开源中文字体。
      # 不能用 Windows 的微软雅黑（微软版权，进不了仓库），也装不到 Ubuntu 上。
      # 这一步失败不影响出稿 —— cover.py 会自己跳过，战报照常生成。
      - name: 装封面依赖
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei
          python -m pip install --quiet --disable-pip-version-check pillow

      # 数据来自 ESPN 公开接口，不需要任何 Key。
      # BALLDONTLIE_API_KEY 只是 ESPN 万一改接口时的比分兜底，没配也能跑。
      # 14:10 早档专用：当天还有比赛没终场就整档跳过，
      # 免得推一份少了几场的残缺战报上线，交给 15:30 那档补齐。
      # 其它档命中不了这个 if，gate 的 output 为空时下面条件为真，照常跑。
      - name: 早档检查（是否全部终场）
        id: gate
        if: github.event.schedule == '10 6 * * *'
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime

          # 口径与 fetch_nba.py 默认一致：北京时间今天减一天 = 美国比赛日
          bj = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
          day = (bj.date() - datetime.timedelta(days=1)).strftime("%Y%m%d")
          url = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + day
          go = "true"
          try:
              with urllib.request.urlopen(url, timeout=25) as r:
                  data = json.load(r)
              evs = data.get("events", [])
              pending = [e.get("shortName", e.get("name", "?")) for e in evs
                         if not e["competitions"][0].get("status", {}).get("type", {}).get("completed")]
              print("比赛日", day, "共", len(evs), "场 / 未终场", len(pending), "场", pending)
              if pending:
                  go = "false"
          except Exception as ex:
              print("ESPN 记分板拉取失败，早档跳过：", ex)
              go = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("go=" + go + "\n")
          print("早档放行，开始出稿" if go == "true" else "早档跳过，等 15:30 那档")
          PY

      - name: 生成战报
        if: steps.gate.outputs.go != 'false'
        env:
          REPORT_GAME_DATE: ${{ inputs.game_date }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          echo "运行时间：$(date '+%Y-%m-%d %H:%M %Z')"
          python scripts/fetch_nba.py

      # 下面两步都是「锦上添花」，任何一步挂掉都不该连累后面把战报推上去，
      # 所以都挂 continue-on-error。
      - name: 写运行摘要
        if: ${{ always() && steps.gate.outputs.go != 'false' }}
        continue-on-error: true
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("docs/latest.json")
          if not p.exists():
              print("### ⚠️ 没有产出 latest.json，脚本可能中途失败\n")
              print("去看上面的「生成战报」步骤日志。")
              raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"### 去球吧 · {d['game_date']}（美国时间）\n")
          print(f"- 生成时间：{d['generated_at']}")
          print(f"- 完场场次：{d.get('total_games', 0)} 场")
          if d.get("headline"):
              print(f"- 今日最胶着：{d['headline']}")
          # 今日主打：公众号次条和头条号都发这一场
          f = pathlib.Path("docs/feature.json")
          if f.exists():
              fp = json.loads(f.read_text(encoding="utf-8"))
              if fp.get("pick"):
                  print(f"- 今日主打：{fp['pick']}（{fp.get('kind')}）")
                  print(f"- 可用的头条标题：{fp.get('title')}")
              else:
                  print("- 今日主打：今天没有比赛，不发次条")
          t = d.get("tomorrow") or {}
          if t.get("status") == "play" and t.get("pick"):
              pk = t["pick"]
              print(f"- 明日焦点：{pk.get('away')} @ {pk.get('home')}（{pk.get('bj_date')} {pk.get('bj_time')}）")
          elif t.get("status") == "idle":
              print(f"- 明日休战，下一比赛日 {t.get('date_cn')}")
          print("\n→ 成品：`docs/report.html`（公众号主条）、`docs/feature.md`（次条 + 头条）")
          PY

      # 只负责把人叫回来：推一条摘要到微信，点开就是 Pages 上的战报。
      # 不碰公众号任何接口 —— 个人订阅号没有群发权限，最后一步必须人工点。
      # 没配 SC_KEY 就静默跳过。
      - name: 微信提醒
        if: steps.gate.outputs.go != 'false'
        continue-on-error: true
        env:
          SC_KEY: ${{ secrets.SC_KEY }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: python scripts/notify.py

      - name: 归档产物
        if: steps.gate.outputs.go != 'false'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: daily-report-${{ github.run_number }}
          path: docs/
          retention-days: 30

      # 真正要紧的一步放最后：前面任何一步出错都不影响它。
      - name: 回写仓库
        if: steps.gate.outputs.go != 'false'
        run: |
          git config user.name "nba-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "战报：$(date '+%Y-%m-%d') 自动生成"

          # 有人在网页端改过文件时，直接 push 会被拒（non-fast-forward）。
          # 拉取远端变基后再推，最多试三次。
          for i in 1 2 3; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送被拒，拉取远端后重试"
            if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              echo "变基失败，放弃本地这次提交（下次运行会自动重新生成）"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          echo "连续三次推送失败，请检查仓库权限或分支保护设置"
          exit 1
